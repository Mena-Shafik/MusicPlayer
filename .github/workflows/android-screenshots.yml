name: Android screenshots

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    name: Capture screenshots on emulator
    runs-on: ubuntu-latest
    env:
      # Opt-in to Node.js 24 for actions that are updated to support it (optional)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: |
          ./gradlew build --no-daemon --stacktrace

